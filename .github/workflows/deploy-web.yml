name: Build & Deploy Web Version

on:
  push:
    branches: [Main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pygame pygbag

      - name: Build web version
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          # --html embeds all Python source into the HTML (no CDN download needed during build)
          # --cdn sets the runtime CDN that browsers will use to load pythons.js
          # We use a background process + timeout because pygbag still tries to contact
          # the CDN after building; we kill it once the HTML file appears
          pygbag --build --html --cdn "https://pygame-web.github.io/archives/0.9/" . &
          PYGBAG_PID=$!

          for i in $(seq 1 60); do
            if ls build/web/*.html 2>/dev/null | grep -q .; then
              echo "HTML generated after ${i}s"
              break
            fi
            sleep 1
          done

          kill $PYGBAG_PID 2>/dev/null || true
          wait $PYGBAG_PID 2>/dev/null || true

          # Copy whatever .html pygbag generated to index.html
          # (filename varies depending on the checkout directory name)
          HTML_FILE=$(ls build/web/*.html 2>/dev/null | head -1)
          if [ -n "$HTML_FILE" ]; then
            cp "$HTML_FILE" build/web/index.html
            echo "index.html created from $HTML_FILE"
            head -3 build/web/index.html
          else
            echo "ERROR: no .html file was generated by pygbag"
            ls -la build/web/ || echo "build/web missing"
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
