name: Build & Deploy Web Version

on:
  push:
    branches: [Main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pygame pygbag

      - name: Build web version
        run: |
          # pygbag expects the SOURCE DIRECTORY, not main.py
          pygbag --build .
          echo "--- build/web contents after pygbag ---"
          ls -la build/web/ || echo "build/web does not exist"

      - name: Create index.html if missing
        run: |
          if [ ! -f build/web/index.html ]; then
            echo "pygbag did not generate index.html — copying from pygbag package template..."
            mkdir -p build/web
            PYGBAG_DIR=$(python -c "import pygbag, os; print(os.path.dirname(pygbag.__file__))")
            echo "pygbag package dir: $PYGBAG_DIR"
            find "$PYGBAG_DIR" -name "index.html" 2>/dev/null | head -5
            TEMPLATE=$(find "$PYGBAG_DIR" -name "index.html" 2>/dev/null | head -1)
            if [ -n "$TEMPLATE" ]; then
              cp "$TEMPLATE" build/web/index.html
              echo "Copied template from: $TEMPLATE"
            else
              echo "ERROR: Could not find pygbag template index.html"
              echo "pygbag package contents:"
              find "$PYGBAG_DIR" -type f | sort
              exit 1
            fi
          fi
          echo "--- index.html first 30 lines ---"
          head -30 build/web/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
