name: Build & Deploy Web Version

on:
  push:
    branches: [Main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pygame pygbag

      - name: Build web version
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          # default.tmpl is committed to the repo — pygbag uses it directly, no CDN download needed.
          # --cdn sets the runtime URL embedded in index.html for the browser to use.
          pygbag --build --cdn "https://pygame-web.github.io/archives/0.9/" . &
          PYGBAG_PID=$!

          for i in $(seq 1 60); do
            if [ -f build/web/index.html ]; then
              echo "index.html generated after ${i}s"
              break
            fi
            sleep 1
          done

          kill $PYGBAG_PID 2>/dev/null || true
          wait $PYGBAG_PID 2>/dev/null || true

          echo "--- build/web contents ---"
          ls -la build/web/

          if [ ! -f build/web/index.html ]; then
            echo "ERROR: index.html was not generated"
            exit 1
          fi

          head -5 build/web/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
