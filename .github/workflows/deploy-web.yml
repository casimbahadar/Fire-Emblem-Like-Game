name: Build & Deploy Web Version

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pygame pygbag

      - name: Build web version
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          # Standard pygbag APK build — no --html flag.
          # pygbag packages all Python into an APK (zip), downloads
          # the cdn/0.9.3 template, and writes build/web/index.html.
          # The browser runtime (cdn/0.9.3/pythons.js) then downloads
          # the APK and runs main.py — confirmed working in screenshot.
          pygbag --build .

          echo "=== build/web contents ==="
          ls -la build/web/

          if [ ! -f build/web/index.html ]; then
            echo "ERROR: index.html not generated"
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
